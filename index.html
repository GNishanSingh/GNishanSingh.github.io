    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
      // 3D Background initialization
      (function initBackground() {
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        camera.position.z = 30;

        // Create particle system - reduce for mobile performance
        const isMobile = window.innerWidth < 768;
        const particleCount = isMobile ? 80 : 150;
        const particles = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];
        const colors = new Float32Array(particleCount * 3);

        const accentColor = new THREE.Color(0x7df9ff);
        const goldColor = new THREE.Color(0xf6c453);

        for (let i = 0; i < particleCount; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 60;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 40;

          velocities.push({
            x: (Math.random() - 0.5) * 0.02,
            y: (Math.random() - 0.5) * 0.02,
            z: (Math.random() - 0.5) * 0.01
          });

          const color = Math.random() > 0.7 ? goldColor : accentColor;
          colors[i * 3] = color.r;
          colors[i * 3 + 1] = color.g;
          colors[i * 3 + 2] = color.b;
        }

        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.15,
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystem);

        // Create connection lines
        const lineGeometry = new THREE.BufferGeometry();
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x7df9ff,
          transparent: true,
          opacity: 0.15,
          blending: THREE.AdditiveBlending
        });
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lines);

        // Create floating geometric shapes - fewer on mobile
        const shapes = [];
        const shapeMaterial = new THREE.MeshBasicMaterial({
          color: 0x7df9ff,
          wireframe: true,
          transparent: true,
          opacity: 0.3
        });

        const shapeCount = isMobile ? 4 : 8;
        for (let i = 0; i < shapeCount; i++) {
          let geometry;
          const shapeType = Math.floor(Math.random() * 3);
          if (shapeType === 0) {
            geometry = new THREE.OctahedronGeometry(Math.random() * 1.5 + 0.5);
          } else if (shapeType === 1) {
            geometry = new THREE.TetrahedronGeometry(Math.random() * 1.5 + 0.5);
          } else {
            geometry = new THREE.IcosahedronGeometry(Math.random() * 1 + 0.3);
          }

          const mesh = new THREE.Mesh(geometry, shapeMaterial.clone());
          mesh.position.set(
            (Math.random() - 0.5) * 50,
            (Math.random() - 0.5) * 50,
            (Math.random() - 0.5) * 20 - 10
          );
          mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
          mesh.userData = {
            rotationSpeed: { x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01 },
            floatSpeed: Math.random() * 0.5 + 0.2,
            floatOffset: Math.random() * Math.PI * 2
          };
          shapes.push(mesh);
          scene.add(mesh);
        }

        // Mouse interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
          mouseX = (e.clientX / window.innerWidth) * 2 - 1;
          mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Animation loop
        const connectionDistance = 8;
        let time = 0;

        function animate() {
          requestAnimationFrame(animate);
          time += 0.01;

          const posArray = particles.attributes.position.array;
          const linePositions = [];

          for (let i = 0; i < particleCount; i++) {
            posArray[i * 3] += velocities[i].x;
            posArray[i * 3 + 1] += velocities[i].y;
            posArray[i * 3 + 2] += velocities[i].z;

            // Boundary wrapping
            if (Math.abs(posArray[i * 3]) > 30) velocities[i].x *= -1;
            if (Math.abs(posArray[i * 3 + 1]) > 30) velocities[i].y *= -1;
            if (Math.abs(posArray[i * 3 + 2]) > 20) velocities[i].z *= -1;

            // Connect nearby particles
            for (let j = i + 1; j < particleCount; j++) {
              const dx = posArray[i * 3] - posArray[j * 3];
              const dy = posArray[i * 3 + 1] - posArray[j * 3 + 1];
              const dz = posArray[i * 3 + 2] - posArray[j * 3 + 2];
              const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (dist < connectionDistance) {
                linePositions.push(
                  posArray[i * 3], posArray[i * 3 + 1], posArray[i * 3 + 2],
                  posArray[j * 3], posArray[j * 3 + 1], posArray[j * 3 + 2]
                );
              }
            }
          }

          particles.attributes.position.needsUpdate = true;
          lineGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePositions), 3));

          // Animate shapes
          shapes.forEach((shape) => {
            shape.rotation.x += shape.userData.rotationSpeed.x;
            shape.rotation.y += shape.userData.rotationSpeed.y;
            shape.position.y += Math.sin(time * shape.userData.floatSpeed + shape.userData.floatOffset) * 0.02;
          });

          // Mouse interaction
          camera.position.x += (mouseX * 3 - camera.position.x) * 0.02;
          camera.position.y += (mouseY * 2 - camera.position.y) * 0.02;
          camera.lookAt(scene.position);

          particleSystem.rotation.y += 0.0003;

          renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      })();

      // Matrix Rain Effect
      (function initMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const charArray = chars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
          ctx.fillStyle = 'rgba(8, 11, 16, 0.05)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = 'rgba(125, 249, 255, 0.35)';
          ctx.font = fontSize + 'px monospace';

          for (let i = 0; i < drops.length; i++) {
            const char = charArray[Math.floor(Math.random() * charArray.length)];
            ctx.fillStyle = Math.random() > 0.98 ? '#f6c453' : 'rgba(125, 249, 255, 0.35)';
            ctx.fillText(char, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });
      })();

      // Cursor Trail Effect
      (function initCursorTrail() {
        const trail = document.getElementById('cursor-trail');
        const particles = [];
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'trail-particle';
          trail.appendChild(particle);
          particles.push({
            el: particle,
            x: 0,
            y: 0,
            size: Math.random() * 6 + 2,
            speedX: 0,
            speedY: 0
          });
        }

        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        function animateTrail() {
          let prevX = mouseX;
          let prevY = mouseY;

          particles.forEach((p, i) => {
            const delay = (i + 1) * 0.08;
            p.x += (prevX - p.x) * (0.3 - delay * 0.01);
            p.y += (prevY - p.y) * (0.3 - delay * 0.01);

            p.el.style.left = p.x + 'px';
            p.el.style.top = p.y + 'px';
            p.el.style.width = p.size * (1 - i / particleCount) + 'px';
            p.el.style.height = p.size * (1 - i / particleCount) + 'px';
            p.el.style.opacity = 1 - i / particleCount;

            prevX = p.x;
            prevY = p.y;
          });

          requestAnimationFrame(animateTrail);
        }

        animateTrail();
      })();

      // Click Ripple Effect
      document.addEventListener('click', (e) => {
        const ripple = document.createElement('div');
        ripple.className = 'click-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 1000);
      });
    </script>
