<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Gurmukh Nishan Singh</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #0a0e14;
        color: #7df9ff;
        font-family: 'Space Mono', monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 520px;
        padding: 2rem;
      }

      .code {
        font-size: 6rem;
        font-weight: 700;
        color: #f6c453;
        line-height: 1;
        margin-bottom: 1rem;
      }

      .message {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
      }

      .sub {
        color: #8a9bb5;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }

      a {
        display: inline-block;
        color: #0a0e14;
        background: #7df9ff;
        text-decoration: none;
        padding: 0.75rem 2rem;
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 0.9rem;
        border: none;
        transition: background 0.2s;
      }

      a:hover {
        background: #f6c453;
      }

      .prompt {
        margin-top: 2rem;
        color: #556677;
        font-size: 0.8rem;
      }

      .prompt span { color: #7df9ff; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <div class="message">Access Denied — Target Not Found</div>
      <div class="sub">The page you requested does not exist or has been relocated.</div>
      <a href="/">Return to Terminal</a>
      <div class="prompt"><span>$</span> cd /home</div>
    </div>
  </body>
</html>
